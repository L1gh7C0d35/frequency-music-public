<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070908"><meta property="og:title" content="Command the Day | Frequency"><meta property="og:description" content="Percussion-forward motivational duet with stomps, toms, chopped strings and crowd responses."><title>Command the Day | Frequency</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -12%,#193125 0,#0b0e0c 43%,#070908 100%);color:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,620px);padding:40px 0 70px}.brand{font-size:11px;letter-spacing:2.2px;color:#8fc8a1;font-weight:800}.card{margin-top:12px;background:rgba(21,27,23,.92);border:1px solid rgba(164,205,178,.15);border-radius:28px;padding:24px}h1{font-size:36px;line-height:1.04;margin:5px 0 8px}.sub{font-size:14px;color:#9ccbaa;margin-bottom:15px}.desc{font-size:14px;color:#9ea8a1;line-height:1.55}audio{width:100%;margin:24px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}button,a.btn{border:0;border-radius:14px;padding:13px;font-weight:800;text-align:center;text-decoration:none;font:inherit}.primary{background:#b7efc8;color:#071009}.secondary{background:#26342d;color:#eef7f1}.note{font-size:11px;color:#748078;margin-top:18px;text-align:center}</style></head>
<body><main><div class="brand">FREQUENCY</div><div class="card"><h1>Command the Day</h1><div class="sub">Cinematic pop / hip-hop</div><div class="desc">Percussion-forward motivational duet with stomps, toms, chopped strings and crowd responses.</div><audio controls playsinline preload="metadata" src="audio/command-the-day.m4a"></audio><div class="actions"><button id="share" class="primary">Share song</button><button id="copy" class="secondary">Copy link</button></div><div class="actions"><a class="btn secondary" href="new-batch.html">New batch</a><a class="btn secondary" href="index.html">All songs</a></div><div id="status" class="note">Frequency original music</div></div></main>
<script>const url=location.href.split('#')[0];const data={title:"Command the Day | Frequency",text:"Command the Day - Percussion-forward motivational duet with stomps, toms, chopped strings and crowd responses.",url};share.onclick=async()=>{try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);status.textContent='Link copied'}}catch(e){}};copy.onclick=async()=>{try{await navigator.clipboard.writeText(url);status.textContent='Link copied'}catch(e){}};</script></body></html>
