name: Publish Frequency Android Web Preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frequency-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public music site
        uses: actions/checkout@v4
      - name: Build catalog from published audio and app snapshot
        run: python3 scripts/build_listening_catalog.py
      - name: Validate preview
        run: python3 -m unittest discover -s scripts -p 'test_listening_room.py' -v
      - name: Prepare site bundle
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.site' --exclude='_site' --exclude='scripts' --exclude='README.md' --exclude='*.pyc' --exclude='__pycache__' ./ _site/
          test -f _site/index.html
          test -f _site/listening-catalog.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
